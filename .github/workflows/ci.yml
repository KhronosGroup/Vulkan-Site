# Github CI file for Vulkan Antora Guide

name: CI

# Controls when the action will run.
#
# Build runs here on `pull_request` (untrusted: no secrets, forked PR code is
# safe to execute). Deployment (which needs write-scoped secrets) happens in
# the separate ci-deploy.yml workflow, triggered by workflow_run once this
# workflow completes successfully. This avoids checking out and executing
# untrusted fork code in a context that has repo secrets (a "pwn request").
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      Antora_UI_Hash:
        description: 'Antora UI hash (branch name or tag) to use passed from the caller workflow'
        default: 'main'
        required: false
        type: string
      GLSL_Commit_Hash:
        description: 'GLSL Commit hash (branch name or tag) to use passed from the caller workflow'
        default: 'main'
        required: false
        type: string
      Guide_Commit_Hash:
        description: 'Guide Commit hash (branch name or tag) to use passed from the caller workflow'
        default: 'main'
        required: false
        type: string
      DOC_Commit_Hash:
        description: 'Docs Commit hash (branch name or tag) to use passed from the caller workflow'
        default: 'main'
        required: false
        type: string
      Samples_Commit_Hash:
        description: 'Samples Commit hash (branch name or tag) to use passed from the caller workflow'
        default: 'main'
        required: false
        type: string
      Tutorial_Commit_Hash:
        description: 'Tutorial Commit hash (branch name or tag) to use passed from the caller workflow'
        default: 'main'
        required: false
        type: string
      Publish_Local:
        description: 'Should publish to the local github pages https://${GITHUB_REPOSITORY}.github.io'
        default: true
        required: false
        type: boolean
      Include_Guide:
        description: 'Should include the Vulkan-Guide module'
        default: true
        required: false
        type: boolean
      Include_GLSL:
        description: 'Should include the GLSL module'
        default: true
        required: false
        type: boolean
      Include_Docs:
        description: 'Should include the Vulkan-Docs module'
        default: true
        required: false
        type: boolean
      Include_Samples:
        description: 'Should include the Vulkan-Samples module'
        default: true
        required: false
        type: boolean
      Include_Tutorial:
        description: 'Should include the Vulkan-Tutorial module'
        default: true
        required: false
        type: boolean
      Include_Attachments:
        description: 'Should include the attachments folder for the tutorial (cleans it first)'
        default: true
        required: false
        type: boolean
      Optimize_Images:
        description: 'Should optimize the images folder'
        default: false
        required: false
        type: boolean
      PR_Number:
        description: 'PR number to publish to (leave empty for main site)'
        default: ''
        required: false
        type: string
      Generate_Man_Pages:
        description: 'Generate LLM output manpages and markdown'
        default: false
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can
      # access it. No `repository`/`ref` override here: for the `pull_request`
      # event the default checkout is already the PR head, and this job has
      # no secrets, so it's safe to build untrusted fork code.
      - uses: actions/checkout@v5

      - name: "REUSE license checker"
        uses: fsfe/reuse-action@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: "Cache UI bundle"
        id: cache-ui
        uses: actions/cache@v5
        with:
          path: build/ui-bundle.zip
          key: ${{ runner.os }}-ui-${{ hashFiles('src/**', 'package-lock.json', 'gulpfile.js') }}

      - name: "checkout GLSL"
        if: ${{ (github.event.inputs.Include_GLSL || 'true') != 'false' }}
        uses: actions/checkout@v5
        with:
          repository: KhronosGroup/GLSL
          path: ./GLSL
          ref: ${{ inputs.GLSL_Commit_Hash > '' && inputs.GLSL_Commit_Hash || 'main' }}

      - name: "checkout Vulkan Guide"
        if: ${{ (github.event.inputs.Include_Guide || 'true') != 'false' }}
        uses: actions/checkout@v5
        with:
          repository: KhronosGroup/Vulkan-Guide
          path: ./Vulkan-Guide
          ref: ${{ inputs.Guide_Commit_Hash > '' && inputs.Guide_Commit_Hash || 'main' }}

      - name: "Checkout Vulkan Docs"
        if: ${{ (github.event.inputs.Include_Docs || 'true') != 'false' }}
        uses: actions/checkout@v5
        with:
          repository: KhronosGroup/Vulkan-Docs
          path: ./Vulkan-Docs
          ref: ${{ inputs.DOC_Commit_Hash > '' && inputs.DOC_Commit_Hash || 'main' }}

      - name: "Checkout Vulkan Samples"
        if: ${{ (github.event.inputs.Include_Samples || 'true') != 'false' }}
        uses: actions/checkout@v5
        with:
          repository: KhronosGroup/Vulkan-Samples
          path: ./Vulkan-Samples
          ref: ${{ inputs.Samples_Commit_Hash > '' && inputs.Samples_Commit_Hash || 'main' }}

      - name: "Checkout Vulkan Tutorial"
        if: ${{ (github.event.inputs.Include_Tutorial || 'true') != 'false' }}
        uses: actions/checkout@v5
        with:
          repository: KhronosGroup/Vulkan-Tutorial
          path: ./Vulkan-Tutorial
          ref: ${{ inputs.Tutorial_Commit_Hash > '' && inputs.Tutorial_Commit_Hash || 'main' }}

      - name: "setup npm"
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: 'npm'
          cache-dependency-path: |
            docs-site/package-lock.json
            package-lock.json
            Vulkan-Docs/package-lock.json

      - name: "run npm installs (parallel)"
        run: |
          (cd docs-site && npm ci) &
          if [ -d "Vulkan-Docs" ]; then (cd Vulkan-Docs && npm ci) & fi
          if [ "${{ steps.cache-ui.outputs.cache-hit }}" != "true" ]; then npm ci & fi
          wait

      - name: "ensure we have all dependencies for building/searching/highlighting"
        run: |
          sudo gem install rouge
          sudo apt-get update
          sudo apt install xorg-dev libglu1-mesa-dev
          sudo apt-get install -y asciidoctor optipng jpegoptim
          pip install lxml PyYAML

      - name: "build the ui bundle"
        if: steps.cache-ui.outputs.cache-hit != 'true'
        run: |
          ./node_modules/gulp/bin/gulp.js bundle

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v7
        with:
          name: ui-bundle.zip
          path: build/ui-bundle.zip
          retention-days: 5

      - name: "copy ui-bundle.zip to vulkan-site"
        run: cp build/ui-bundle.zip docs-site/

      - name: "prepare tutorials"
        if: ${{ (github.event.inputs.Include_Tutorial || 'true') != 'false' }}
        working-directory: Vulkan-Tutorial/antora
        run: |
          make setup_tutorial

      - name: "build test site"
        # This should be a separate step from the overall site build, just here ATM for testing
        working-directory: docs-site
        run: npx antora uitest.yml --to-dir build/uitest --stacktrace

      - name: "prepare repos with make (parallel)"
        run: |
          if [[ "${{ (github.event.inputs.Include_GLSL || 'true') != 'false' }}" == "true" ]]; then make prep-glsl & fi
          if [[ "${{ (github.event.inputs.Include_Guide || 'true') != 'false' }}" == "true" ]]; then make prep-guide & fi
          if [[ "${{ (github.event.inputs.Include_Docs || 'true') != 'false' }}" == "true" ]]; then make prep-docs & fi
          wait

      - name: "prepare samples"
        if: ${{ (github.event.inputs.Include_Samples || 'true') != 'false' }}
        working-directory: Vulkan-Samples
        run: cmake -H"." -B"build/unix" -DVKB_GENERATE_ANTORA_SITE=ON

      - name: "Prepare Antora Playbook"
        run: |
          python3 docs-site/prepare_playbook.py \
            --guide "${{ (github.event.inputs.Include_Guide || 'true') != 'false' }}" \
            --glsl "${{ (github.event.inputs.Include_GLSL || 'true') != 'false' }}" \
            --docs "${{ (github.event.inputs.Include_Docs || 'true') != 'false' }}" \
            --samples "${{ (github.event.inputs.Include_Samples || 'true') != 'false' }}" \
            --tutorial "${{ (github.event.inputs.Include_Tutorial || 'true') != 'false' }}" \
            --attachments "${{ (github.event.inputs.Include_Attachments || 'true') != 'false' }}" \
            --optimize "${{ github.event.inputs.Optimize_Images == 'true' }}"

      - name: "Cache Antora content"
        uses: actions/cache@v5
        with:
          path: docs-site/.antora-cache
          key: ${{ runner.os }}-antora-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-antora-

      - name: "build (npx) with stacktrace"
        working-directory: docs-site
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          GOOGLE_TAG_MANAGER_KEY: "GTM-WVL3BDCB"
        run: |
          npx antora antora-playbook.yml --cache-dir .antora-cache --key "google_tag_manager=${GOOGLE_TAG_MANAGER_KEY}"
          touch build/site/.nojekyll

      - name: "Remove site-docs when not generating man pages"
        if: "${{ github.event.inputs.Generate_Man_Pages != 'true' }}"
        working-directory: docs-site
        run: |
          rm -rf build/site/site-docs

      - name: 'Upload site artifact'
        uses: actions/upload-artifact@v7
        with:
          name: fullSite
          path: docs-site/build
          retention-days: 5

      - name: "Write deploy metadata"
        run: |
          set -euo pipefail
          IS_PR="false"
          PR_NUM=""
          PR_URL=""
          if [[ "${{ github.event.pull_request }}" != "" || "${{ github.event.inputs.PR_Number }}" != "" ]]; then
            IS_PR="true"
            PR_NUM="${{ github.event.inputs.PR_Number }}"
            if [ -z "$PR_NUM" ]; then PR_NUM="${{ github.event.number }}"; fi
            PR_URL="${{ github.event.pull_request.html_url }}"
          fi
          mkdir -p deploy-metadata
          cat > deploy-metadata/metadata.json <<EOF
          {
            "is_pr": "${IS_PR}",
            "pr_num": "${PR_NUM}",
            "pr_url": "${PR_URL}",
            "publish_local": "${{ (github.event.inputs.Publish_Local || 'true') != 'false' }}"
          }
          EOF
          cat deploy-metadata/metadata.json

      - name: "Upload deploy metadata"
        uses: actions/upload-artifact@v7
        with:
          name: deploy-metadata
          path: deploy-metadata/metadata.json

  generate-man-pages:
    runs-on: ubuntu-latest
    if: "${{ github.event.inputs.Generate_Man_Pages == 'true' }}"
    needs: build

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: "Checkout Vulkan Docs"
        uses: actions/checkout@v5
        with:
          repository: KhronosGroup/Vulkan-Docs
          path: ./Vulkan-Docs
          ref: ${{ inputs.DOC_Commit_Hash > '' && inputs.DOC_Commit_Hash || 'main' }}
          submodules: recursive

      - name: "Checkout mcp-Vulkan indexer"
        uses: actions/checkout@v5
        with:
          repository: gpx1000/mcp-Vulkan
          path: ./mcp-Vulkan
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: "run npm install for Vulkan-Docs"
        working-directory: Vulkan-Docs
        run: npm install

      - name: "run npm install for docs-site"
        working-directory: docs-site
        run: npm install

      - name: "ensure we have all dependencies for building man pages"
        run: |
          sudo gem install rouge
          sudo apt-get update
          sudo apt-get install -y asciidoctor
          pip install lxml
          pip install -r mcp-Vulkan/docs-index/requirements.txt

      - name: "Download site artifact"
        uses: actions/download-artifact@v8
        with:
          name: fullSite
          path: docs-site/build

      - name: 'Generate man pages and combine with markdown index'
        run: |
          # Create a common output directory
          mkdir -p combined_output

          # Run the makefile task to generate man pages
          cd Vulkan-Docs
          make manhtmlpages

          # Install node-html-markdown package
          cd ..
          npm install node-html-markdown

          # Create a Node.js script to convert HTML to Markdown
          cat > convert-html-to-md.js << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const { htmlToMarkdown } = require('./html-to-markdown');

          // Directory containing HTML files
          const htmlDir = path.join(__dirname, 'Vulkan-Docs/gen/out/man/html');

          // Custom function to safely decode URI components
          function safeDecodeURIComponent(encodedString) {
            if (!encodedString) return '';

            // Handle all percent-encoded characters in a general way
            return encodedString.replace(/%([0-9A-F]{2})/gi, (match, hex) => {
              try {
                // Try to decode this specific percent-encoded sequence
                return decodeURIComponent(match);
              } catch (error) {
                // If decoding fails, handle special cases
                if (match === '%5F') return '_';  // Handle underscore
                if (match === '%20') return ' ';  // Handle space
                if (match === '%22') return '"';  // Handle double quote
                if (match === '%3C') return '<';  // Handle less than
                if (match === '%3E') return '>';  // Handle greater than
                if (match === '%23') return '#';  // Handle hash
                if (match === '%25') return '%';  // Handle percent
                if (match === '%2F') return '/';  // Handle forward slash
                if (match === '%3A') return ':';  // Handle colon
                if (match === '%3F') return '?';  // Handle question mark
                if (match === '%26') return '&';  // Handle ampersand
                if (match === '%3D') return '=';  // Handle equals

                // For other cases, try to convert the hex value to a character
                try {
                  const charCode = parseInt(hex, 16);
                  return String.fromCharCode(charCode);
                } catch (e) {
                  // If all else fails, return the original encoded string
                  return match;
                }
              }
            });
          }

          // Process all HTML files in the directory
          const files = fs.readdirSync(htmlDir);

          files.forEach(file => {
            if (path.extname(file).toLowerCase() === '.html') {
              const htmlPath = path.join(htmlDir, file);
              const htmlWithEncoded = fs.readFileSync(htmlPath, 'utf8');

              // Safely decode the HTML content
              const htmlContent = safeDecodeURIComponent(htmlWithEncoded);

              // Convert HTML to Markdown
              const markdownContent = htmlToMarkdown(htmlContent);

              // Create markdown file with the same name but .md extension
              const mdFilename = path.basename(file, '.html') + '.md';
              const mdPath = path.join(htmlDir, mdFilename);

              fs.writeFileSync(mdPath, markdownContent);
              console.log(`Converted ${file} to ${mdFilename}`);
            }
          });
          EOF

          # Run the conversion script
          node convert-html-to-md.js

          # Create a man folder under the combined_output directory
          mkdir -p combined_output/man

          # move only the markdown files to the man folder under combined_output directory
          mv Vulkan-Docs/gen/out/man/html/*.md combined_output/man/

          # move the markdown index files to the common output directory
          mv docs-site/build/site/site-docs/* combined_output/

      - name: 'Upload LLM output artifact'
        uses: actions/upload-artifact@v7
        with:
          name: combinedOutput
          path: combined_output
          retention-days: 5

      - name: 'Build Vulkan docs MCP index'
        env:
          VULKAN_DOCS_INDEX_SOURCE_REF: ${{ github.sha }}
        run: |
          python3 mcp-Vulkan/docs-index/build_index.py \
            --source combined_output \
            --db vulkan-docs-index.db \
            --source-ref "$VULKAN_DOCS_INDEX_SOURCE_REF"

      - name: 'Upload Vulkan docs MCP index artifact'
        uses: actions/upload-artifact@v7
        with:
          name: vulkanDocsIndex
          path: vulkan-docs-index.db
          retention-days: 5
